; Local development OPcache tuning, mounted into the Laravel web containers by docker-compose.yml.
;
; The service code is bind-mounted from the Windows drive (9p/drvfs), where every stat() is slow.
; With the image default (revalidate_freq=2) OPcache re-stats ~540 files per request whenever
; 2s have passed, which adds ~0.5s to the first request after any pause.
;
; Trade-off: an edited PHP file can take up to 30s to be picked up. To apply a change instantly,
; restart the service: docker compose restart <service>
opcache.validate_timestamps=1
opcache.revalidate_freq=30
