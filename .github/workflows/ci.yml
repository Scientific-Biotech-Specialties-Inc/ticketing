name: 'CI - Build & Lint Check'

on:
  push:
    branches: [ "main", "dev", "staging" ]
  pull_request:
    branches: [ "main", "dev", "staging" ]

jobs:
  validate-docker:
    name: 'Validate Docker Compose Production File'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare mock .env
        run: cp .env.production.example .env

      - name: Validate docker-compose.prod.yml
        run: docker compose -f docker-compose.prod.yml config

      # Each service image has its own build context, so the php-fpm runtime files are copied
      # into every service. Fail if any copy differs from ticket-service's.
      - name: Check php-fpm runtime files are identical across services
        run: |
          status=0
          for svc in services/*/; do
            for f in nginx.conf php-fpm.conf start.sh; do
              if ! diff -q "services/ticket-service/docker/runtime/$f" "${svc}docker/runtime/$f" >/dev/null 2>&1; then
                echo "::error file=${svc}docker/runtime/$f::differs from services/ticket-service/docker/runtime/$f (or is missing)"
                status=1
              fi
            done
          done
          exit $status

  frontend-build:
    name: 'Frontend Build Check'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build frontend SPA
        working-directory: frontend/web
        run: npm run build
