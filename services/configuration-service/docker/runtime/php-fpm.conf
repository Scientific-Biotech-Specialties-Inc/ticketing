; php-fpm pool overrides for the Laravel app (loaded after the image's www.conf).
; Identical in every service (services/*/docker/runtime/). CI fails if the copies drift apart.

[www]
; Keep container environment variables (DB_HOST, APP_KEY, ...). php-fpm clears them by default,
; which would make Laravel fall back to .env values.
clear_env = no

; Worker count. Override per container with PHP_FPM_MAX_CHILDREN (default set in the Dockerfile).
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Recycle workers periodically to contain memory leaks.
pm.max_requests = 500

; Matches nginx fastcgi_read_timeout.
request_terminate_timeout = 300s

; nginx already logs every request; send PHP errors and worker output to the container log.
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no
