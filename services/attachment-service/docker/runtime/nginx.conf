# HTTP front for the Laravel app: nginx on :8000 hands PHP requests to php-fpm on 127.0.0.1:9000.
# Port 8000 is what the gateway (nginx.prod.conf) and Azure Container Apps ingress already target.
#
# Identical in every service (services/*/docker/runtime/). CI fails if the copies drift apart.

server {
    listen 8000 default_server;
    server_name _;

    root /var/www/public;
    index index.php;

    # Upper bound only. Each service's real upload limit is PHP's post_max_size (Dockerfile).
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass 127.0.0.1:9000;
        # Long enough for slow upstream calls (Gemini, ClamAV scans, SMTP).
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
