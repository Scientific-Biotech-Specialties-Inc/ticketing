# Customer portal edge (spec 0044).
#
# Used only by the customer build (VITE_APP_MODE=customer). This container is the ONLY door customers
# use: it serves the customer SPA and proxies an allowlist of API prefixes straight to the internal
# ticketing services. It never talks to ticketing-gateway or the central auth module.
#
# Rules:
#   * Every forwarded request carries X-Ticketing-Edge: customer (overwrites any client value).
#   * Only the customer-service refresh_token cookie is forwarded; central SSO cookies never are.
#   * Anything not on the allowlist, and any /internal/ path, returns 404.
#   * proxy_pass targets are literal env URLs (no nginx variables), so no resolver is needed.
#   * Location blocks mirror nginx.gateway.conf.template; keep them in step with it.

# Forward only the customer refresh cookie. An empty value makes nginx drop the Cookie header.
map $cookie_refresh_token $customer_edge_cookie {
    ""      "";
    default "refresh_token=$cookie_refresh_token";
}

server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 30M;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Internal service to service routes are never reachable from the customer portal.
    location ~* /internal(/|$) {
        return 404;
    }

    # Internal only: customer provisioning is not exposed on the customer portal.
    location ~* ^/api/(?:ticketing/)?customer/customers/provision/?$ {
        return 404;
    }

    # Customer Service API (login, refresh, profile, password flows)
    location ~ ^/api/(?:ticketing/)?customer/(.*)$ {
        rewrite ^/api/(?:ticketing/)?customer/(.*)$ /api/$1 break;
        proxy_pass ${CUSTOMER_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $customer_edge_cookie;
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Ticket Service API
    location ~ ^/api/(?:ticketing/)?ticket/(.*)$ {
        rewrite ^/api/(?:ticketing/)?ticket/(.*)$ /api/$1 break;
        proxy_pass ${TICKET_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Attachment Service API
    location ~ ^/api/(?:ticketing/)?attachment/(.*)$ {
        rewrite ^/api/(?:ticketing/)?attachment/(.*)$ /api/$1 break;
        proxy_pass ${ATTACHMENT_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Messaging Service API
    location ~ ^/api/(?:ticketing/)?messaging/(.*)$ {
        rewrite ^/api/(?:ticketing/)?messaging/(.*)$ /api/$1 break;
        proxy_pass ${MESSAGING_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Analytics Service API (Connection close, as on the gateway)
    location ~ ^/api/(?:ticketing/)?analytics/(.*)$ {
        rewrite ^/api/(?:ticketing/)?analytics/(.*)$ /api/$1 break;
        proxy_pass ${ANALYTICS_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # AI Service API
    location ~ ^/api/(?:ticketing/)?ai/(.*)$ {
        rewrite ^/api/(?:ticketing/)?ai/(.*)$ /api/$1 break;
        proxy_pass ${AI_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Configuration Service API (keeps the gateway's optional api/ prefix)
    location ~ ^/api/(?:api/)?(?:ticketing/)?configuration/(.*)$ {
        rewrite ^/api/(?:api/)?(?:ticketing/)?configuration/(.*)$ /api/$1 break;
        proxy_pass ${CONFIGURATION_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # File Storage for Attachments
    location /storage/ {
        proxy_pass ${ATTACHMENT_SERVICE_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie "";
        proxy_set_header X-Ticketing-Edge customer;
    }

    # Everything else under /api/ (employee, notification, central auth routes) is not for customers.
    location /api/ {
        return 404;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
