server {
    listen 80;
    server_name localhost ticketing-gateway;
    client_max_body_size 30M;

    resolver 127.0.0.11 valid=30s;

    # Health check endpoint for Azure Container Apps / probes
    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Employee Service API
    location ~ ^/api/(?:ticketing/)?employee/(.*)$ {
        proxy_pass http://employee-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Ticket Service API
    location ~ ^/api/(?:ticketing/)?ticket/(.*)$ {
        proxy_pass http://ticket-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Attachment Service API
    location ~ ^/api/(?:ticketing/)?attachment/(.*)$ {
        proxy_pass http://attachment-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Messaging Service API
    location ~ ^/api/(?:ticketing/)?messaging/(.*)$ {
        proxy_pass http://messaging-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Notification Service API
    location ~ ^/api/(?:ticketing/)?notification/(.*)$ {
        proxy_pass http://notification-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Analytics Service API
    location ~ ^/api/(?:ticketing/)?analytics/(.*)$ {
        proxy_pass http://analytics-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "close";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # AI Service API
    location ~ ^/api/(?:ticketing/)?ai/(.*)$ {
        proxy_pass http://ai-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # File Storage for Attachments
    location /storage/ {
        set $attachment_storage http://attachment-service:8000;
        proxy_pass $attachment_storage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
    }

    # Configuration Service API
    location ~ ^/api/(?:api/)?(?:ticketing/)?configuration/(.*)$ {
        proxy_pass http://configuration-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Customer Service API: staff allowlist only (spec 0044, AC-3).
    # Customer login, refresh, password and any future customer route are closed on this gateway.
    location ~* ^/api/(?:ticketing/)?customer/((?:me|logout|heartbeat|employee-statuses|encryption-key|profile|notification-preferences|user|sanctum/csrf-cookie|customers/provision)/?)$ {
        proxy_pass http://customer-service:8000/api/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Spec 0044: mark traffic as staff (overwrites any client value).
        proxy_set_header X-Ticketing-Edge staff;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # Every other customer-service route is closed on the staff gateway (spec 0044, AC-3).
    location ~* ^/api/(?:ticketing/)?customer(?:/|$) {
        return 404;
    }
}
